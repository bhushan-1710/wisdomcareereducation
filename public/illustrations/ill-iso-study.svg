<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480" fill="none">
  <!-- WCE Program Isometric Tile: Study Abroad (ill-iso-study) -->
  <defs>
    <!-- Soft isometric tile shadow -->
    <filter id="iso-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#0F1B3D" flood-opacity="0.10" />
    </filter>
    <linearGradient id="tile-base-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F0F7FF" />
    </linearGradient>
  </defs>

  <!-- Base Isometric Floating Plinth (30° projection) -->
  <!-- Top surface -->
  <polygon points="240,80 420,184 240,288 60,184" fill="#E0F2FE" />
  <!-- Left side (shaded) -->
  <polygon points="60,184 240,288 240,320 60,216" fill="#BAE6FD" />
  <!-- Right side (medium shadow) -->
  <polygon points="240,288 420,184 420,216 240,320" fill="#93C5FD" />

  <!-- University Academic Portico on Tile -->
  <g filter="url(#iso-shadow)">
    <!-- Base steps -->
    <polygon points="240,150 350,214 240,276 130,214" fill="#FFFFFF" />
    <polygon points="130,214 240,276 240,288 130,226" fill="#CBD5E1" />
    <polygon points="240,276 350,214 350,226 240,288" fill="#94A3B8" />

    <!-- Academy Building Facade -->
    <!-- Front left face -->
    <polygon points="150,195 240,247 240,165 150,113" fill="#1E356F" />
    <!-- Front right face (shaded) -->
    <polygon points="240,247 330,195 330,113 240,165" fill="#0F1B3D" />

    <!-- Colonnade Columns (White & Sky) -->
    <!-- Column 1 -->
    <polygon points="175,200 185,206 185,146 175,140" fill="#FFFFFF" />
    <polygon points="185,206 189,204 189,144 185,146" fill="#CBD5E1" />
    <!-- Column 2 -->
    <polygon points="205,217 215,223 215,163 205,157" fill="#FFFFFF" />
    <polygon points="215,223 219,221 219,161 215,163" fill="#CBD5E1" />
    <!-- Column 3 -->
    <polygon points="265,223 275,217 275,157 265,163" fill="#CBD5E1" />
    <polygon points="261,225 265,223 265,163 261,165" fill="#FFFFFF" />
    <!-- Column 4 -->
    <polygon points="295,206 305,200 305,140 295,146" fill="#CBD5E1" />
    <polygon points="291,208 295,206 295,146 291,148" fill="#FFFFFF" />

    <!-- Portico Pediment Roof -->
    <polygon points="140,115 240,55 240,165 140,115" fill="#2563EB" />
    <polygon points="240,55 340,115 340,165 240,165" fill="#162752" />
    <!-- Gold Medallion on pediment -->
    <ellipse cx="240" cy="118" rx="14" ry="16" fill="#FFC857" />
  </g>

  <!-- Graduation Cap (Mortarboard) Hovering Top-Left -->
  <g transform="translate(100, 90)">
    <!-- Cap Diamond (Top surface illuminated) -->
    <polygon points="40,25 80,45 40,65 0,45" fill="#0F1B3D" />
    <polygon points="40,25 76,43 40,60 4,43" fill="#162752" />
    <!-- Skull cap underneath -->
    <polygon points="25,55 55,55 55,75 25,75" fill="#0F1B3D" />
    <!-- Gold button & tassel -->
    <circle cx="40" cy="45" r="4" fill="#FFC857" />
    <path d="M40 45 Q58 50 64 68" stroke="#FFC857" stroke-width="2.5" fill="none" />
    <rect x="61" y="68" width="6" height="12" rx="2" fill="#FFC857" />
  </g>

  <!-- World Globe Hovering Top-Right -->
  <g transform="translate(310, 100)">
    <!-- Globe Stand -->
    <path d="M45 90 L45 110" stroke="#0F1B3D" stroke-width="5" stroke-linecap="round" />
    <ellipse cx="45" cy="112" rx="20" ry="7" fill="#0F1B3D" />
    <path d="M15 50 A 35 35 0 0 0 75 50" stroke="#FFC857" stroke-width="4" fill="none" />
    <!-- Globe Sphere -->
    <circle cx="45" cy="48" r="32" fill="#2563EB" />
    <!-- Continents in Sage Green -->
    <path d="M30 35 Q40 28 50 36 Q56 46 44 58 Q34 50 30 35 Z" fill="#8FBF5A" />
    <path d="M52 48 Q64 45 68 55 Q62 68 52 62 Z" fill="#8FBF5A" />
    <!-- Latitude rings -->
    <ellipse cx="45" cy="48" rx="30" ry="12" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1.5" fill="none" />
  </g>

  <!-- Floating Paper Plane Accent -->
  <g transform="translate(190, 310) rotate(-15)">
    <polygon points="30,0 60,30 30,24 0,30" fill="#FFFFFF" />
    <polygon points="30,0 60,30 30,24" fill="#CBD5E1" />
    <polygon points="30,8 35,18 30,16 25,18" fill="#D95338" />
  </g>
</svg>
