<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" fill="none">
  <!-- WCE Paper Plane Top-Down View (ill-plane-top) -->
  <defs>
    <filter id="plane-soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="8" stdDeviation="6" flood-color="#0F1B3D" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Offset cast shadow -->
  <polygon points="50,20 16,80 50,68 84,80" fill="#0F1B3D" fill-opacity="0.14" transform="translate(0, 4)" />

  <!-- Plane Body -->
  <g filter="url(#plane-soft-shadow)">
    <!-- Right outer wing (tonal shadow) -->
    <polygon points="48,12 86,76 48,64" fill="#94A3B8" />

    <!-- Right inner fold (medium slate) -->
    <polygon points="48,12 56,66 48,64" fill="#CBD5E1" />

    <!-- Left inner fold (soft sky-white) -->
    <polygon points="48,12 40,66 48,64" fill="#F0F7FF" />

    <!-- Left outer wing (illuminated pure white) -->
    <polygon points="48,12 10,76 48,64" fill="#FFFFFF" />

    <!-- Center spine crease fold -->
    <polygon points="48,12 45,64 48,64 51,64" fill="#E2E8F0" />

    <!-- WCE Brand Coral accent cockpit / fold tag -->
    <polygon points="48,22 52,38 48,35 44,38" fill="#D95338" />
  </g>
</svg>
