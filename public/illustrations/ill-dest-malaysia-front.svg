<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" width="480" height="600" fill="none">
  <!-- WCE Destination Malaysia: Front Layer (ill-dest-malaysia-front) -->
  <defs>
    <filter id="my-f-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0F1B3D" flood-opacity="0.12" />
    </filter>
  </defs>

  <g filter="url(#my-f-shadow)">
    <!-- Tower 1 -->
    <g transform="translate(170, 110)">
      <polygon points="19,0 21,0 21,48 19,48" fill="#CBD5E1" />
      <circle cx="20" cy="48" r="4" fill="#0F1B3D" />
      <polygon points="12,50 28,50 26,90 14,90" fill="#1E356F" />
      <polygon points="8,90 32,90 30,160 10,160" fill="#162752" />
      <rect x="2" y="160" width="36" height="220" rx="3" fill="#0F1B3D" />
      <line x1="2" y1="190" x2="38" y2="190" stroke="#93C5FD" stroke-width="2" />
      <line x1="2" y1="230" x2="38" y2="230" stroke="#93C5FD" stroke-width="2" />
      <line x1="2" y1="270" x2="38" y2="270" stroke="#93C5FD" stroke-width="2" />
      <line x1="2" y1="310" x2="38" y2="310" stroke="#93C5FD" stroke-width="2" />
      <line x1="2" y1="350" x2="38" y2="350" stroke="#93C5FD" stroke-width="2" />
    </g>
    <!-- Tower 2 -->
    <g transform="translate(270, 110)">
      <polygon points="19,0 21,0 21,48 19,48" fill="#CBD5E1" />
      <circle cx="20" cy="48" r="4" fill="#0F1B3D" />
      <polygon points="12,50 28,50 26,90 14,90" fill="#1E356F" />
      <polygon points="8,90 32,90 30,160 10,160" fill="#162752" />
      <rect x="2" y="160" width="36" height="220" rx="3" fill="#0F1B3D" />
      <line x1="2" y1="190" x2="38" y2="190" stroke="#93C5FD" stroke-width="2" />
      <line x1="2" y1="230" x2="38" y2="230" stroke="#93C5FD" stroke-width="2" />
      <line x1="2" y1="270" x2="38" y2="270" stroke="#93C5FD" stroke-width="2" />
      <line x1="2" y1="310" x2="38" y2="310" stroke="#93C5FD" stroke-width="2" />
      <line x1="2" y1="350" x2="38" y2="350" stroke="#93C5FD" stroke-width="2" />
    </g>
    <!-- Skybridge -->
    <g transform="translate(208, 305)">
      <rect x="0" y="0" width="64" height="14" rx="2" fill="#E2E8F0" />
      <line x1="6" y1="7" x2="58" y2="7" stroke="#2563EB" stroke-width="3" />
      <line x1="8" y1="14" x2="28" y2="32" stroke="#94A3B8" stroke-width="2.5" />
      <line x1="56" y1="14" x2="36" y2="32" stroke="#94A3B8" stroke-width="2.5" />
    </g>
  </g>

  <!-- Park & Palms -->
  <path d="M0 500 Q240 470 480 500 L480 600 L0 600 Z" fill="#8FBF5A" />
  <path d="M0 530 Q240 510 480 530 L480 600 L0 600 Z" fill="#6B9E38" />

  <g transform="translate(40, 480)">
    <path d="M20 70 Q25 20 45 -20" stroke="#0F1B3D" stroke-width="6" stroke-linecap="round" fill="none" />
    <path d="M45 -20 Q70 -50 90 -30 Q65 -20 45 -20 Z" fill="#4D7C23" />
    <path d="M45 -20 Q20 -60 0 -40 Q25 -25 45 -20 Z" fill="#8FBF5A" />
    <path d="M45 -20 Q0 -10 -20 10 Q10 0 45 -20 Z" fill="#6B9E38" />
  </g>

  <g transform="translate(410, 490) scale(-1, 1)">
    <path d="M20 60 Q25 15 45 -15" stroke="#0F1B3D" stroke-width="6" stroke-linecap="round" fill="none" />
    <path d="M45 -15 Q70 -45 90 -25 Q65 -15 45 -15 Z" fill="#4D7C23" />
    <path d="M45 -15 Q20 -55 0 -35 Q25 -20 45 -15 Z" fill="#8FBF5A" />
  </g>

  <g transform="translate(110, 180) rotate(-18)">
    <polygon points="26,0 0,34 26,28" fill="#FFFFFF" />
    <polygon points="26,0 52,34 26,28" fill="#CBD5E1" />
    <polygon points="26,6 30,16 26,14 22,16" fill="#D95338" />
  </g>
</svg>
