<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" fill="none">
  <!-- WCE Journey Step 5: Fly & Get Placed (ill-step-5) -->
  <defs>
    <filter id="icon-step5-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0F1B3D" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Circular background badge -->
  <circle cx="48" cy="48" r="42" fill="#FFE9E3" />

  <g filter="url(#icon-step5-shadow)">
    <!-- Flight Arc Dotted Trajectory -->
    <path d="M18 72 Q36 34 76 34" stroke="#0F1B3D" stroke-opacity="0.25" stroke-width="2.5" stroke-dasharray="4 4" fill="none" />

    <!-- Arrival Destination Horizon Arch -->
    <path d="M16 78 Q48 64 80 78" stroke="#D95338" stroke-width="4" stroke-linecap="round" fill="none" />

    <!-- Taking Flight Paper Plane (Signature WCE Plane) -->
    <g transform="translate(42, 18) rotate(22)">
      <!-- Left Wing (White) -->
      <polygon points="26,0 0,36 26,30" fill="#FFFFFF" />
      <!-- Right Wing (Slate/Navy Shaded) -->
      <polygon points="26,0 52,36 26,30" fill="#CBD5E1" />
      <!-- Under fold -->
      <polygon points="26,0 26,30 22,34" fill="#94A3B8" />
      <!-- Coral Wing Accent -->
      <polygon points="26,6 30,16 26,14 22,16" fill="#D95338" />
    </g>

    <!-- Success Starburst at destination -->
    <polygon points="76,64 78,69 83,70 79,74 80,79 76,76 72,79 73,74 69,70 74,69" fill="#FFC857" />
  </g>
</svg>
