<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" fill="none">
  <!-- WCE Journey Step 4: Visa & Documentation Support (ill-step-4) -->
  <defs>
    <filter id="icon-step4-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0F1B3D" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Circular background badge -->
  <circle cx="48" cy="48" r="42" fill="#F0F7FF" />

  <g filter="url(#icon-step4-shadow)">
    <!-- Passport Booklet (Deep Navy with Gold Emblem) - angled background left -->
    <g transform="translate(18, 22)">
      <rect x="0" y="0" width="36" height="52" rx="5" fill="#0F1B3D" />
      <rect x="3" y="0" width="2" height="52" fill="#1E356F" />
      <!-- Gold Emblem Crest -->
      <circle cx="18" cy="22" r="9" stroke="#FFC857" stroke-width="1.5" fill="none" />
      <polygon points="18,16 20,20 24,20 21,23 22,27 18,24 14,27 15,23 12,20 16,20" fill="#FFC857" />
      <line x1="8" y1="38" x2="28" y2="38" stroke="#1E356F" stroke-width="1.5" stroke-linecap="round" />
      <line x1="10" y1="42" x2="26" y2="42" stroke="#1E356F" stroke-width="1.5" stroke-linecap="round" />
    </g>

    <!-- Checklist / Documentation Sheets (Foreground Right) -->
    <g transform="translate(36, 18)">
      <!-- Under-sheet for stack effect -->
      <rect x="4" y="-3" width="36" height="52" rx="4" fill="#E2E8F0" />
      <!-- Main document sheet with folded corner -->
      <path d="M0 0 L28 0 L38 10 L38 54 C38 56 36 58 34 58 L4 58 C2 58 0 56 0 54 Z" fill="#FFFFFF" />
      <polygon points="28,0 28,10 38,10" fill="#CBD5E1" />

      <!-- Document Header -->
      <line x1="6" y1="8" x2="22" y2="8" stroke="#0F1B3D" stroke-width="2" stroke-linecap="round" />

      <!-- Checklist Item 1 -->
      <circle cx="9" cy="18" r="2.5" fill="#8FBF5A" />
      <line x1="15" y1="18" x2="31" y2="18" stroke="#64748B" stroke-width="2" stroke-linecap="round" />

      <!-- Checklist Item 2 -->
      <circle cx="9" cy="26" r="2.5" fill="#8FBF5A" />
      <line x1="15" y1="26" x2="33" y2="26" stroke="#64748B" stroke-width="2" stroke-linecap="round" />

      <!-- Checklist Item 3 -->
      <circle cx="9" cy="34" r="2.5" fill="#CBD5E1" />
      <line x1="15" y1="34" x2="28" y2="34" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" />

      <!-- Checklist Item 4 -->
      <circle cx="9" cy="42" r="2.5" fill="#CBD5E1" />
      <line x1="15" y1="42" x2="24" y2="42" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Inspection Magnifying Glass / Verification Symbol -->
    <g transform="translate(50, 46)">
      <!-- Glass Lens -->
      <circle cx="16" cy="16" r="13" fill="#E0F2FE" fill-opacity="0.85" stroke="#0F1B3D" stroke-width="2.5" />
      <!-- Lens glare arc -->
      <path d="M8 12 A 10 10 0 0 1 18 6" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" fill="none" />
      <!-- Verification subtle check inside lens -->
      <path d="M11 16 L14 19 L21 12" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Handle -->
      <line x1="25" y1="25" x2="35" y2="35" stroke="#0F1B3D" stroke-width="4.5" stroke-linecap="round" />
      <line x1="25" y1="25" x2="28" y2="28" stroke="#D95338" stroke-width="4.5" stroke-linecap="round" />
    </g>
  </g>
</svg>
