<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240" fill="none">
  <!-- WCE Form Success Confirmation Animation Scene (ill-form-success) -->
  <defs>
    <filter id="success-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#0F1B3D" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Circular Soft Background Pulse -->
  <circle cx="160" cy="130" r="95" fill="#F0FDF4" />
  <circle cx="160" cy="130" r="80" stroke="#8FBF5A" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="4 4" fill="none" />

  <g filter="url(#success-shadow)">
    <!-- 1. Postal Envelope Base (Foreground, Opened) -->
    <g transform="translate(90, 110)">
      <!-- Envelope Back Flap -->
      <polygon points="0,30 70,0 140,30 140,90 0,90" fill="#CBD5E1" />
      <!-- Letter Sheet emerging -->
      <rect x="15" y="10" width="110" height="65" rx="4" fill="#FFFFFF" />
      <line x1="28" y1="24" x2="68" y2="24" stroke="#93C5FD" stroke-width="3" stroke-linecap="round" />
      <line x1="28" y1="34" x2="102" y2="34" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" />
      <line x1="28" y1="42" x2="90" y2="42" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" />
      <!-- Envelope Front Pockets -->
      <polygon points="0,90 70,45 140,90" fill="#E2E8F0" />
      <polygon points="0,30 70,55 0,90" fill="#F1F5F9" />
      <polygon points="140,30 70,55 140,90" fill="#E2E8F0" />
    </g>

    <!-- 2. Paper Plane Taking Flight from Envelope -->
    <g transform="translate(155, 35) rotate(-18)">
      <!-- Left Wing (White) -->
      <polygon points="36,0 0,48 36,40" fill="#FFFFFF" />
      <!-- Right Wing (Slate) -->
      <polygon points="36,0 72,48 36,40" fill="#CBD5E1" />
      <!-- Fuselage -->
      <polygon points="36,0 36,40 30,46" fill="#94A3B8" />
      <!-- Coral Wing Accent -->
      <polygon points="36,8 42,20 36,17 30,20" fill="#D95338" />
    </g>

    <!-- 3. Success Green Checkmark Rosette Badge -->
    <g transform="translate(205, 130)">
      <circle cx="16" cy="16" r="16" fill="#8FBF5A" />
      <path d="M10 16 L14 20 L22 12" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Upward Flight Vapor Rings -->
  <path d="M145 125 Q150 90 170 70" stroke="#8FBF5A" stroke-width="2" stroke-dasharray="3 3" fill="none" opacity="0.6" />
</svg>
