<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" fill="none">
  <!-- WCE Sector Tile: Engineering & Construction (ill-sector-engineering) -->
  <defs>
    <filter id="eng-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0F1B3D" flood-opacity="0.10" />
    </filter>
  </defs>

  <!-- Pastel Rounded Tile Background -->
  <rect x="12" y="12" width="216" height="216" rx="28" fill="#F1F5F9" />

  <!-- Shadow underneath -->
  <ellipse cx="120" cy="186" rx="66" ry="14" fill="#0F1B3D" fill-opacity="0.08" />

  <g filter="url(#eng-shadow)">
    <!-- 1. Blueprint Grid Base Paper (Tilted) -->
    <g transform="translate(48, 68) rotate(-6)">
      <rect x="0" y="0" width="130" height="96" rx="8" fill="#2563EB" />
      <path d="M15 0 L15 96 M35 0 L35 96 M55 0 L55 96 M75 0 L75 96 M95 0 L95 96 M115 0 L115 96" stroke="#93C5FD" stroke-opacity="0.4" stroke-width="1" />
      <path d="M0 20 L130 20 M0 40 L130 40 M0 60 L130 60 M0 80 L130 80" stroke="#93C5FD" stroke-opacity="0.4" stroke-width="1" />
      <!-- Blueprint drafting sketch -->
      <polygon points="25,25 65,25 65,70 25,70" stroke="#FFFFFF" stroke-width="2" fill="none" />
      <line x1="25" y1="25" x2="65" y2="70" stroke="#FFFFFF" stroke-width="1.5" />
    </g>

    <!-- 2. Precision Cog / Gear (Large Navy with Gold Hub) -->
    <g transform="translate(112, 106)">
      <!-- Gear Teeth -->
      <path d="M40 10 L48 10 L49 18 L57 21 L64 16 L70 22 L65 29 L68 37 L76 38 L76 46 L68 47 L65 55 L70 62 L64 68 L57 63 L49 66 L48 74 L40 74 L39 66 L31 63 L24 68 L18 62 L23 55 L20 47 L12 46 L12 38 L20 37 L23 29 L18 22 L24 16 L31 21 L39 18 Z" fill="#0F1B3D" />
      <!-- Gear Center Rim -->
      <circle cx="44" cy="42" r="24" fill="#1E356F" />
      <circle cx="44" cy="42" r="16" fill="#F1F5F9" />
      <!-- Center Gold Axle -->
      <circle cx="44" cy="42" r="8" fill="#FFC857" />
    </g>

    <!-- 3. Engineering Caliper / Drafting Compass (Coral Accent) -->
    <g transform="translate(38, 48)">
      <!-- Left leg -->
      <line x1="28" y1="12" x2="10" y2="76" stroke="#D95338" stroke-width="6" stroke-linecap="round" />
      <!-- Right leg -->
      <line x1="28" y1="12" x2="52" y2="76" stroke="#C03E26" stroke-width="6" stroke-linecap="round" />
      <!-- Top joint pivot -->
      <circle cx="28" cy="12" r="8" fill="#0F1B3D" />
      <circle cx="28" cy="12" r="3.5" fill="#FFFFFF" />
      <!-- Brass measuring arc -->
      <path d="M16 48 Q28 58 46 48" stroke="#FFC857" stroke-width="3.5" fill="none" stroke-linecap="round" />
    </g>
  </g>
</svg>
