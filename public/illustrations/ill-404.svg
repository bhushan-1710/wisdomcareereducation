<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" fill="none">
  <!-- WCE 404 Scene: Adrift Paper Plane in Clouds (ill-404) -->
  <defs>
    <linearGradient id="cloud-404-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="70%" stop-color="#F0F7FF" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <filter id="plane-404-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#0F1B3D" flood-opacity="0.16" />
    </filter>
  </defs>

  <rect width="600" height="400" rx="20" fill="url(#cloud-404-sky)" />

  <!-- Background Fluffy Clouds -->
  <!-- Cloud 1 (Left Back) -->
  <g fill="#FFFFFF" opacity="0.9" transform="translate(40, 80)">
    <circle cx="60" cy="60" r="45" />
    <circle cx="110" cy="50" r="35" />
    <circle cx="150" cy="70" r="30" />
    <rect x="30" y="60" width="140" height="35" rx="10" />
  </g>

  <!-- Cloud 2 (Right Back) -->
  <g fill="#FFFFFF" opacity="0.9" transform="translate(360, 100)">
    <circle cx="70" cy="60" r="45" />
    <circle cx="120" cy="50" r="40" />
    <circle cx="170" cy="70" r="32" />
    <rect x="40" y="60" width="150" height="35" rx="10" />
  </g>

  <!-- Cloud 3 (Bottom foreground puff) -->
  <g fill="#E0F2FE" transform="translate(180, 260)">
    <circle cx="80" cy="70" r="60" />
    <circle cx="150" cy="60" r="55" />
    <circle cx="210" cy="75" r="45" />
    <rect x="40" y="70" width="200" height="40" rx="15" fill="#FFFFFF" />
  </g>

  <!-- Curving Lost Loop-de-Loop Trail -->
  <path d="M120 280 C200 320 220 180 300 180 C360 180 380 240 330 260 C280 280 260 210 320 160 C360 120 440 140 480 180" stroke="#2563EB" stroke-opacity="0.3" stroke-width="3" stroke-dasharray="6 6" fill="none" />

  <!-- Paper Plane Adrift in Mid-Air -->
  <g filter="url(#plane-404-shadow)" transform="translate(290, 140) rotate(-35)">
    <polygon points="50,0 0,68 50,56" fill="#FFFFFF" />
    <polygon points="50,0 100,68 50,56" fill="#CBD5E1" />
    <polygon points="50,0 50,56 42,64" fill="#94A3B8" />
    <polygon points="50,12 58,28 50,24 42,28" fill="#D95338" />
  </g>

  <!-- Floating Question Mark Navigation Beacon -->
  <g transform="translate(390, 80)">
    <circle cx="25" cy="25" r="22" fill="#FFC857" />
    <path d="M20 18 C20 14 23 11 27 11 C31 11 34 14 34 18 C34 22 28 23 28 27" stroke="#0F1B3D" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <circle cx="28" cy="34" r="2.5" fill="#0F1B3D" />
  </g>
</svg>
