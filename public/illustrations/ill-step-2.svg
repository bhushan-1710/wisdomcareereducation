<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" fill="none">
  <!-- WCE Journey Step 2: Choose Program & Country (ill-step-2) -->
  <defs>
    <filter id="icon-step2-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0F1B3D" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Circular background badge -->
  <circle cx="48" cy="48" r="42" fill="#EFF6FF" />

  <g filter="url(#icon-step2-shadow)">
    <!-- World Globe Compass Disc -->
    <circle cx="48" cy="48" r="28" fill="#1E356F" />
    <circle cx="48" cy="48" r="23" fill="#2563EB" />

    <!-- Continents -->
    <path d="M36 40 Q44 32 54 40 Q58 50 48 58 Q38 52 36 40 Z" fill="#8FBF5A" />
    <path d="M54 48 Q64 45 66 54 Q60 62 52 58 Z" fill="#8FBF5A" />
    <ellipse cx="48" cy="48" rx="22" ry="8" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1.5" fill="none" />

    <!-- Compass Cardinal Markers -->
    <polygon points="48,27 50,33 46,33" fill="#FFC857" />
    <polygon points="48,69 50,63 46,63" fill="#FFC857" />
    <polygon points="27,48 33,50 33,46" fill="#FFC857" />
    <polygon points="69,48 63,50 63,46" fill="#FFC857" />

    <!-- Destination Pin (Warm Coral) -->
    <g transform="translate(48, 20)">
      <path d="M0 0 C-6 0 -10 4.5 -10 10.5 C-10 18 0 28 0 28 C0 28 10 18 10 10.5 C10 4.5 6 0 0 0 Z" fill="#D95338" />
      <circle cx="0" cy="9.5" r="4.5" fill="#FFFFFF" />
    </g>
  </g>
</svg>
