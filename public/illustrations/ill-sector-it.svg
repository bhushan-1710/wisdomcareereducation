<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" fill="none">
  <!-- WCE Sector Tile: Information Technology (ill-sector-it) -->
  <defs>
    <filter id="it-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0F1B3D" flood-opacity="0.10" />
    </filter>
  </defs>

  <!-- Pastel Rounded Tile Background (Soft Sky) -->
  <rect x="12" y="12" width="216" height="216" rx="28" fill="#F0F9FF" />

  <!-- Shadow underneath -->
  <ellipse cx="120" cy="186" rx="68" ry="14" fill="#0F1B3D" fill-opacity="0.08" />

  <g filter="url(#it-shadow)">
    <!-- 1. Modern Tech Monitor / Display -->
    <g transform="translate(46, 50)">
      <!-- Monitor Stand -->
      <polygon points="66,104 82,104 86,124 62,124" fill="#CBD5E1" />
      <rect x="48" y="122" width="52" height="6" rx="3" fill="#94A3B8" />

      <!-- Screen Outer Bezel (Deep Navy) -->
      <rect x="0" y="0" width="148" height="106" rx="10" fill="#0F1B3D" />
      <!-- Display Panel (Dark IDE Editor) -->
      <rect x="6" y="6" width="136" height="92" rx="6" fill="#162752" />

      <!-- Window Title Bar Dots -->
      <circle cx="16" cy="16" r="3.5" fill="#D95338" />
      <circle cx="26" cy="16" r="3.5" fill="#FFC857" />
      <circle cx="36" cy="16" r="3.5" fill="#8FBF5A" />

      <!-- Code Brackets </> Symbol -->
      <g stroke-linecap="round" stroke-linejoin="round">
        <!-- Left bracket < -->
        <path d="M46 44 L32 54 L46 64" stroke="#60A5FA" stroke-width="4.5" fill="none" />
        <!-- Slash / -->
        <line x1="74" y1="38" x2="62" y2="70" stroke="#FFC857" stroke-width="4.5" />
        <!-- Right bracket > -->
        <path d="M90 44 L104 54 L90 64" stroke="#60A5FA" stroke-width="4.5" fill="none" />
      </g>

      <!-- Code Syntax Blocks at bottom -->
      <line x1="20" y1="82" x2="60" y2="82" stroke="#8FBF5A" stroke-width="3" stroke-linecap="round" />
      <line x1="68" y1="82" x2="105" y2="82" stroke="#BAE6FD" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- 2. Cloud Server / Microchip Node (Foreground Right) -->
    <g transform="translate(136, 126)">
      <!-- Cloud Server Base -->
      <rect x="0" y="8" width="56" height="34" rx="6" fill="#FFFFFF" />
      <rect x="4" y="14" width="48" height="8" rx="2" fill="#2563EB" />
      <circle cx="10" cy="18" r="2" fill="#8FBF5A" />
      <circle cx="16" cy="18" r="2" fill="#8FBF5A" />
      <circle cx="46" cy="18" r="2" fill="#FFC857" />

      <rect x="4" y="26" width="48" height="8" rx="2" fill="#E2E8F0" />
      <circle cx="10" cy="30" r="2" fill="#8FBF5A" />
      <circle cx="16" cy="30" r="2" fill="#8FBF5A" />
    </g>
  </g>
</svg>
