<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" width="720" height="560" fill="none">
  <!-- WCE Spotlight Feature: University Campus (ill-spot-study) -->
  <defs>
    <filter id="spot-study-shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#0F1B3D" flood-opacity="0.10" />
    </filter>
  </defs>

  <!-- Large Pastel Isometric Base Plinth (30° projection) -->
  <polygon points="360,60 640,220 360,380 80,220" fill="#E0F2FE" />
  <polygon points="80,220 360,380 360,420 80,260" fill="#BAE6FD" />
  <polygon points="360,380 640,220 640,260 360,420" fill="#93C5FD" />

  <g filter="url(#spot-study-shadow)">
    <!-- Grand University Hall & Academic Library (Center) -->
    <!-- Foundation Podium -->
    <polygon points="360,160 520,250 360,340 200,250" fill="#FFFFFF" />
    <polygon points="200,250 360,340 360,356 200,266" fill="#CBD5E1" />
    <polygon points="360,340 520,250 520,266 360,356" fill="#94A3B8" />

    <!-- Left Building Wing (Navy) -->
    <polygon points="230,220 360,295 360,170 230,95" fill="#1E356F" />
    <!-- Right Building Wing (Deep Navy) -->
    <polygon points="360,295 490,220 490,95 360,170" fill="#0F1B3D" />

    <!-- Grand Classical Pediment Roof -->
    <polygon points="220,100 360,20 360,170 220,100" fill="#2563EB" />
    <polygon points="360,20 500,100 500,170 360,170" fill="#162752" />
    <ellipse cx="360" cy="110" rx="18" ry="20" fill="#FFC857" />

    <!-- Colonnade Columns Left -->
    <polygon points="260,230 274,238 274,158 260,150" fill="#FFFFFF" />
    <polygon points="274,238 278,236 278,156 274,158" fill="#CBD5E1" />
    <polygon points="300,253 314,261 314,181 300,173" fill="#FFFFFF" />
    <polygon points="314,261 318,259 318,179 314,181" fill="#CBD5E1" />

    <!-- Colonnade Columns Right -->
    <polygon points="402,261 416,253 416,173 402,181" fill="#CBD5E1" />
    <polygon points="398,263 402,261 402,181 398,183" fill="#FFFFFF" />
    <polygon points="442,238 456,230 456,150 442,158" fill="#CBD5E1" />
    <polygon points="438,240 442,238 442,158 438,160" fill="#FFFFFF" />

    <!-- Grand Academic Clock Tower Spire -->
    <polygon points="340,70 360,30 380,70" fill="#FFC857" />
    <circle cx="360" cy="55" r="5" fill="#0F1B3D" />

    <!-- Campus Green Lawn Courtyard & Pathway -->
    <polygon points="200,270 280,316 230,345 150,299" fill="#8FBF5A" />
    <polygon points="440,316 520,270 570,299 490,345" fill="#8FBF5A" />

    <!-- Campus Trees on Courtyard -->
    <ellipse cx="190" cy="300" rx="20" ry="28" fill="#6B9E38" />
    <ellipse cx="530" cy="300" rx="20" ry="28" fill="#6B9E38" />
  </g>

  <!-- Giant Graduation Mortarboard Floating Top-Left -->
  <g transform="translate(110, 80) rotate(-10)">
    <polygon points="50,25 100,50 50,75 0,50" fill="#0F1B3D" />
    <polygon points="50,25 96,48 50,70 4,48" fill="#162752" />
    <circle cx="50" cy="50" r="5" fill="#FFC857" />
    <path d="M50 50 Q75 55 82 78" stroke="#FFC857" stroke-width="3.5" fill="none" />
    <rect x="78" y="78" width="8" height="15" rx="3" fill="#FFC857" />
  </g>

  <!-- WCE Paper Plane Circling the Academy Courtyard -->
  <g transform="translate(490, 110) rotate(25)">
    <polygon points="32,0 0,42 32,35" fill="#FFFFFF" />
    <polygon points="32,0 64,42 32,35" fill="#CBD5E1" />
    <polygon points="32,8 37,20 32,18 27,20" fill="#D95338" />
  </g>
</svg>
