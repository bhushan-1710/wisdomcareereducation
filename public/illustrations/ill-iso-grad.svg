<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480" fill="none">
  <!-- WCE Program Isometric Tile: Graduate Internships (ill-iso-grad) -->
  <defs>
    <filter id="iso-shadow-grad" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#0F1B3D" flood-opacity="0.10" />
    </filter>
  </defs>

  <!-- Base Isometric Plinth (Sage Green / Sky Base) -->
  <polygon points="240,80 420,184 240,288 60,184" fill="#D6EBB5" />
  <polygon points="60,184 240,288 240,320 60,216" fill="#B4DC8A" />
  <polygon points="240,288 420,184 420,216 240,320" fill="#8FBF5A" />

  <!-- Modern Skyscraper / Global Headquarters Tower -->
  <g filter="url(#iso-shadow-grad)">
    <!-- Base podium -->
    <polygon points="240,150 330,202 240,254 150,202" fill="#FFFFFF" />
    <polygon points="150,202 240,254 240,266 150,214" fill="#CBD5E1" />
    <polygon points="240,254 330,202 330,214 240,266" fill="#94A3B8" />

    <!-- Left Tower Facade (Deep Navy) -->
    <polygon points="170,180 240,220 240,80 170,40" fill="#1E356F" />
    <!-- Right Tower Facade (Shadowed Navy) -->
    <polygon points="240,220 310,180 310,40 240,80" fill="#0F1B3D" />
    <!-- Tower Roof -->
    <polygon points="170,40 240,0 310,40 240,80" fill="#2563EB" />

    <!-- Spire / Antenna -->
    <polygon points="238,0 242,0 241,-28 239,-28" fill="#FFC857" />

    <!-- Isometric Window Grid Strips Left -->
    <g fill="#93C5FD">
      <polygon points="180,68 198,78 198,96 180,86" />
      <polygon points="206,83 224,93 224,111 206,101" />
      <polygon points="180,104 198,114 198,132 180,122" />
      <polygon points="206,119 224,129 224,147 206,137" />
      <polygon points="180,140 198,150 198,168 180,158" />
      <polygon points="206,155 224,165 224,183 206,173" />
    </g>

    <!-- Isometric Window Grid Strips Right (Subtler tint) -->
    <g fill="#60A5FA" fill-opacity="0.6">
      <polygon points="248,93 266,83 266,101 248,111" />
      <polygon points="274,78 292,68 292,86 274,96" />
      <polygon points="248,129 266,119 266,137 248,147" />
      <polygon points="274,114 292,104 292,122 274,132" />
      <polygon points="248,165 266,155 266,173 248,183" />
      <polygon points="274,150 292,140 292,158 274,168" />
    </g>
  </g>

  <!-- Executive Professional Briefcase Hovering Left -->
  <g transform="translate(70, 160)">
    <!-- Main briefcase box (Rich Warm Sand & Saddle Leather) -->
    <polygon points="40,30 90,59 50,82 0,53" fill="#D95338" />
    <polygon points="0,53 50,82 50,116 0,87" fill="#C03E26" />
    <polygon points="50,82 90,59 90,93 50,116" fill="#992A15" />
    <!-- Golden lock buckles -->
    <polygon points="22,64 30,68 30,76 22,72" fill="#FFC857" />
    <polygon points="42,75 50,79 50,87 42,83" fill="#FFC857" />
    <!-- Handle arch -->
    <path d="M35 32 Q45 18 55 38" stroke="#0F1B3D" stroke-width="4" fill="none" stroke-linecap="round" />
  </g>

  <!-- Certificate / Diploma Scroll Hovering Right -->
  <g transform="translate(320, 150)">
    <!-- Diploma Rolled Parchment -->
    <polygon points="20,20 80,55 60,90 0,55" fill="#FFFFFF" />
    <polygon points="0,55 60,90 60,102 0,67" fill="#CBD5E1" />
    <polygon points="60,90 80,55 80,67 60,102" fill="#94A3B8" />
    <!-- Red ribbon seal -->
    <polygon points="36,45 44,50 44,70 36,65" fill="#D95338" />
    <circle cx="40" cy="57" r="7" fill="#D95338" />
    <circle cx="40" cy="57" r="4" fill="#FFC857" />
  </g>
</svg>
