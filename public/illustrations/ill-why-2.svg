<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" fill="none">
  <!-- WCE Why Us Badge 2: Visa & Document Support (ill-why-2) -->
  <defs>
    <filter id="why2-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0F1B3D" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Circular Base Badge -->
  <circle cx="48" cy="48" r="42" fill="#F0F7FF" />
  <circle cx="48" cy="48" r="37" stroke="#0F1B3D" stroke-opacity="0.15" stroke-width="2" stroke-dasharray="3 3" fill="none" />

  <g filter="url(#why2-shadow)">
    <!-- Document Portfolio Folder (Deep Navy) -->
    <path d="M22 28 C22 24.5 24.5 22 28 22 L42 22 L47 27 L68 27 C71.5 27 74 29.5 74 33 L74 68 C74 71.5 71.5 74 68 74 L28 74 C24.5 74 22 71.5 22 68 Z" fill="#0F1B3D" />

    <!-- Document Sheets Stack protruding from Folder -->
    <!-- Under sheet -->
    <rect x="27" y="23" width="38" height="46" rx="3" fill="#E2E8F0" />
    <!-- White primary document sheet -->
    <rect x="25" y="26" width="38" height="46" rx="3" fill="#FFFFFF" />

    <!-- Checklist Header Strip (Primary Blue) -->
    <rect x="30" y="32" width="16" height="3" rx="1.5" fill="#2563EB" />

    <!-- Checklist items with subtle document check ticks -->
    <!-- Row 1 -->
    <path d="M30 41 L33 44 L38 39" stroke="#8FBF5A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="42" y1="41" x2="56" y2="41" stroke="#64748B" stroke-width="2" stroke-linecap="round" />

    <!-- Row 2 -->
    <path d="M30 49 L33 52 L38 47" stroke="#8FBF5A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="42" y1="49" x2="58" y2="49" stroke="#64748B" stroke-width="2" stroke-linecap="round" />

    <!-- Row 3 -->
    <circle cx="34" cy="57" r="2.5" fill="#CBD5E1" />
    <line x1="42" y1="57" x2="54" y2="57" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" />

    <!-- Passport Booklet in Front Stack (Right) -->
    <g transform="translate(46, 42)">
      <rect x="0" y="0" width="28" height="34" rx="4" fill="#1E356F" />
      <line x1="3" y1="0" x2="3" y2="34" stroke="#0F1B3D" stroke-width="1.5" />
      <!-- Gold Passport Crest -->
      <circle cx="15" cy="15" r="6" stroke="#FFC857" stroke-width="1.2" fill="none" />
      <polygon points="15,11 16.5,14 19.5,14 17,16 18,19 15,17 12,19 13,16 10.5,14 13.5,14" fill="#FFC857" />
    </g>

    <!-- Coral Binder Clip at top left holding sheets -->
    <path d="M33 20 C31 20 29 22 29 24 L29 28 L37 28 L37 24 C37 22 35 20 33 20 Z" stroke="#D95338" stroke-width="2" fill="none" stroke-linejoin="round" />
    <rect x="28" y="27" width="10" height="3" rx="1" fill="#D95338" />
  </g>
</svg>
