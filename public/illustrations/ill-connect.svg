<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" fill="none">
  <!-- WCE Connect Enquiry Scene (ill-connect) -->
  <defs>
    <filter id="connect-shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0F1B3D" flood-opacity="0.10" />
    </filter>
  </defs>

  <!-- Soft Rounded Card Background -->
  <rect width="640" height="360" rx="20" fill="#F0F7FF" />

  <!-- Dotted Flight Arc Connection Trail -->
  <path d="M80 280 C180 120 400 90 560 140" stroke="#2563EB" stroke-width="3" stroke-dasharray="6 6" fill="none" opacity="0.35" />

  <g filter="url(#connect-shadow)">
    <!-- 1. Rolling Travel Suitcase (Center Left) -->
    <g transform="translate(140, 110)">
      <!-- Wheels -->
      <circle cx="15" cy="185" r="7" fill="#0F1B3D" />
      <circle cx="75" cy="185" r="7" fill="#0F1B3D" />
      <!-- Luggage Case (Sun Gold) -->
      <rect x="0" y="45" width="90" height="135" rx="14" fill="#FFC857" />
      <!-- Grooves -->
      <rect x="12" y="70" width="66" height="8" rx="3" fill="#F59E0B" />
      <rect x="12" y="100" width="66" height="8" rx="3" fill="#F59E0B" />
      <rect x="12" y="130" width="66" height="8" rx="3" fill="#F59E0B" />
      <!-- Retractable handle -->
      <rect x="30" y="0" width="6" height="45" fill="#94A3B8" />
      <rect x="54" y="0" width="6" height="45" fill="#94A3B8" />
      <rect x="25" y="0" width="40" height="8" rx="3" fill="#0F1B3D" />
      <!-- Airport Baggage Tag (White with Coral Barcode) -->
      <g transform="translate(70, 75) rotate(15)">
        <polygon points="0,0 26,0 20,40 0,40" fill="#FFFFFF" />
        <rect x="4" y="8" width="14" height="2" fill="#D95338" />
        <rect x="4" y="14" width="14" height="2" fill="#0F1B3D" />
        <rect x="4" y="20" width="14" height="2" fill="#0F1B3D" />
      </g>
    </g>

    <!-- 2. Official Passport Book (Center) -->
    <g transform="translate(260, 140)">
      <rect x="0" y="0" width="70" height="100" rx="8" fill="#0F1B3D" />
      <rect x="6" y="0" width="3" height="100" fill="#1E356F" />
      <circle cx="35" cy="42" r="16" stroke="#FFC857" stroke-width="2" fill="none" />
      <polygon points="35,32 38,40 46,40 40,45 42,53 35,48 28,53 30,45 24,40 32,40" fill="#FFC857" />
      <rect x="18" y="72" width="34" height="4" rx="2" fill="#94A3B8" />
    </g>

    <!-- 3. Taking Flight WCE Paper Plane (Upper Right) -->
    <g transform="translate(420, 80) rotate(-15)">
      <polygon points="40,0 0,55 40,46" fill="#FFFFFF" />
      <polygon points="40,0 80,55 40,46" fill="#CBD5E1" />
      <polygon points="40,0 40,46 34,52" fill="#94A3B8" />
      <polygon points="40,10 46,24 40,21 34,24" fill="#D95338" />
    </g>
  </g>

  <!-- Communication Signal Pulse Radiating from Plane -->
  <circle cx="490" cy="110" r="28" stroke="#2563EB" stroke-opacity="0.3" stroke-width="2" fill="none" />
  <circle cx="490" cy="110" r="44" stroke="#2563EB" stroke-opacity="0.15" stroke-width="2" fill="none" />
</svg>
